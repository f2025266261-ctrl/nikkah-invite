<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Paper Grain Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F0" />
      <stop offset="50%" stop-color="#F4EADB" />
      <stop offset="100%" stop-color="#EADBCA" />
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C2F4B" />
      <stop offset="25%" stop-color="#B8935A" />
      <stop offset="50%" stop-color="#DFCA9B" />
      <stop offset="75%" stop-color="#B8935A" />
      <stop offset="100%" stop-color="#9C2F4B" />
    </linearGradient>

    <!-- Soft Radial Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#F4EADB" stop-opacity="0" />
      <stop offset="100%" stop-color="#9C2F4B" stop-opacity="0.12" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#vignette)" />

  <!-- Double Gold Inset Border -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#B8935A" stroke-width="2" stroke-opacity="0.75" />
  <rect x="36" y="36" width="1128" height="558" rx="12" fill="none" stroke="#B8935A" stroke-width="1" stroke-dasharray="8 6" stroke-opacity="0.5" />

  <!-- Corner Filigree Accents -->
  <!-- Top Left -->
  <g transform="translate(48, 48)">
    <path d="M 0 40 Q 0 0 40 0 M 0 20 Q 0 0 20 0" stroke="#B8935A" stroke-width="2" fill="none" />
    <circle cx="4" cy="4" r="3" fill="#9C2F4B" />
  </g>
  <!-- Top Right -->
  <g transform="translate(1152, 48) scale(-1, 1)">
    <path d="M 0 40 Q 0 0 40 0 M 0 20 Q 0 0 20 0" stroke="#B8935A" stroke-width="2" fill="none" />
    <circle cx="4" cy="4" r="3" fill="#9C2F4B" />
  </g>
  <!-- Bottom Left -->
  <g transform="translate(48, 582) scale(1, -1)">
    <path d="M 0 40 Q 0 0 40 0 M 0 20 Q 0 0 20 0" stroke="#B8935A" stroke-width="2" fill="none" />
    <circle cx="4" cy="4" r="3" fill="#9C2F4B" />
  </g>
  <!-- Bottom Right -->
  <g transform="translate(1152, 582) scale(-1, -1)">
    <path d="M 0 40 Q 0 0 40 0 M 0 20 Q 0 0 20 0" stroke="#B8935A" stroke-width="2" fill="none" />
    <circle cx="4" cy="4" r="3" fill="#9C2F4B" />
  </g>

  <!-- Top Center Mughal Arch Crown -->
  <g transform="translate(600, 75)">
    <path d="M -180 80 C -140 30 -60 10 0 0 C 60 10 140 30 180 80" stroke="url(#goldGradient)" stroke-width="2.5" fill="none" />
    <path d="M -160 80 C -125 38 -50 20 0 12 C 50 20 125 38 160 80" stroke="#B8935A" stroke-width="1.2" stroke-dasharray="4 3" fill="none" opacity="0.8" />
    <circle cx="0" cy="0" r="5" fill="#9C2F4B" stroke="#B8935A" stroke-width="1.5" />
    <circle cx="0" cy="-7" r="2.5" fill="#DFCA9B" />
  </g>

  <!-- Bismillah in Arabic Calligraphy -->
  <text x="600" y="165" font-family="'Amiri', 'Traditional Arabic', serif" font-size="34" fill="#B8935A" text-anchor="middle" letter-spacing="3">
    بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
  </text>

  <!-- Event Label -->
  <text x="600" y="220" font-family="'Cinzel', 'Cinzel Decorative', serif" font-size="16" font-weight="600" fill="#B8935A" text-anchor="middle" letter-spacing="6">
    THE NIKKAH CEREMONY OF
  </text>

  <!-- Couple Names -->
  <text x="600" y="315" font-family="'Great Vibes', cursive" font-size="78" fill="#9C2F4B" text-anchor="middle">
    Yashfa Ali
  </text>

  <g transform="translate(600, 360)">
    <line x1="-100" y1="0" x2="-35" y2="0" stroke="#B8935A" stroke-width="1.5" opacity="0.6" />
    <text x="0" y="5" font-family="'Cinzel', serif" font-size="14" fill="#B8935A" text-anchor="middle" letter-spacing="4">WITH</text>
    <line x1="35" y1="0" x2="100" y2="0" stroke="#B8935A" stroke-width="1.5" opacity="0.6" />
  </g>

  <text x="600" y="445" font-family="'Great Vibes', cursive" font-size="78" fill="#9C2F4B" text-anchor="middle">
    Zain Saleem
  </text>

  <!-- Date & Venue -->
  <text x="600" y="505" font-family="'Cinzel', serif" font-size="18" font-weight="700" fill="#2D2321" text-anchor="middle" letter-spacing="4">
    21ST NOVEMBER, 2026 • 2:00 PM
  </text>
  <text x="600" y="540" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="20" fill="#786A65" text-anchor="middle">
    Bahira Town Gul Bahar Block, Lahore
  </text>
</svg>
